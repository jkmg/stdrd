name: stdrd
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10  # Recomendado para compatibilidad con estas versiones
  - numpy=1.24.3
  - pandas=1.5.1
  - scipy=1.9.3
  - pip
  - pip:
    - streamlit==1.37.0
    - streamlit-aggrid==1.0.5          # Soporta Streamlit 1.37
    - streamlit-authenticator==0.3.3   # Evita bucles de sesión
    - Markdown==3.4.3
    - markdown-it-py==2.2.0
    - python-decouple==3.8
    - python-multipart==0.0.22
    - python-utils==3.5.2
    - plotly==5.17.0  # <--- NUEVA DEPENDENCIA PARA LOS GRÁFICOS
